name: Weekly check

on:
  schedule:
    # Mondays at 10:43 UTC (5:43 in Toronto in winter, 6:43 in summer)
    - cron: "43 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the journals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTES_TOKEN: ${{ secrets.NOTES_TOKEN }}
          NOTES_REPO: ${{ vars.NOTES_REPO || format('{0}-notes', github.repository) }}
          READING_ROOM_MODEL: ${{ vars.READING_ROOM_MODEL }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python3 scripts/check.py

      - name: Publish the results
        run: |
          git config user.name "reading-room-check"
          git config user.email "reading-room-check@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Weekly check $(date -u +%F)"
            git push
          fi
