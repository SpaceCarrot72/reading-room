<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  /* Layout: every entry is a text column with a gloss beside it. The author's work sits on the left;
     the desk's remarks (blue ink) and your own notes (marker yellow) sit in the margin. */
  --paper:#FFFFFF;
  --sheet:#FFFFFF;
  --well:#F4F5F8;
  --ink:#14161B;
  --ink-soft:#5A606C;
  --rule:#E1E3E9;
  --desk:#1E3FCC;
  --desk-wash:#EEF1FD;
  --mine-wash:#FFF3B0;
  --mine-edge:#E3C22F;
  --display:"Baskervville","Libre Baskerville","GFS Baskerville",Baskerville,"Times New Roman",serif;
  --text:"Libre Baskerville","GFS Baskerville",Baskerville,Georgia,serif;
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gutter:clamp(16px,4vw,40px);
  color-scheme:light;
}
/* One theme by choice: the page is white whatever the system setting. */

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--desk);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gutter) 96px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding:20px 0 0}
.mark{font:400 22px/1 var(--display);margin:0;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:0 -6px;padding:3px 6px}
.tab{appearance:none;border:0;background:none;color:var(--ink-soft);font:500 14px/1 var(--ui);padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);background:var(--well)}
.tab .n{margin-left:6px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.status{margin-left:auto;font-size:13px;color:var(--ink-soft);white-space:nowrap}

/* lede */
.lede{padding:clamp(36px,7vw,76px) 0 8px;max-width:47rem}
.lede h1{font:400 clamp(34px,5.4vw,60px)/1.04 var(--display);letter-spacing:-0.012em;margin:0;text-wrap:balance}
.lede p{margin:18px 0 0;color:var(--ink-soft);max-width:40rem;line-height:1.55}
.lede-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px}

/* areas and entries */
.area{margin-top:48px;border-top:1px solid var(--ink);padding-top:12px}
.area-h{display:flex;align-items:baseline;gap:10px;margin:0;font:600 14px/1.3 var(--ui)}
.area-h .n{font-weight:400;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.area-sub{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px;max-width:40rem}
.none{margin:18px 0 6px;color:var(--ink-soft);font-size:14px}
.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:3rem minmax(0,1fr) minmax(0,21rem);column-gap:clamp(16px,3vw,36px);padding:24px 0;border-top:1px solid var(--rule)}
.entries > .entry:first-child{border-top:0}
.entry.flat{grid-template-columns:minmax(0,1fr) minmax(0,21rem)}
.num{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-top:7px}
.title{font:400 24px/1.2 var(--display);margin:0;text-wrap:balance}
.title a{color:inherit;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .18s}
.title a:hover,.title a:focus-visible{background-size:100% 1px}
.byline{margin:9px 0 0;font-weight:500;font-size:14px}
.cite{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px}
.tag{display:inline-block;margin:10px 0 0;padding:3px 10px;border:1px solid var(--rule);border-radius:999px;font-size:12.5px;color:var(--ink-soft)}
.argument{font:400 15.5px/1.75 var(--text);margin:16px 0 0;max-width:37rem}
.gloss{align-self:start;border-left:2px solid var(--desk);padding:1px 0 1px 14px;color:var(--desk);font-size:14px;line-height:1.55}
.gloss p{margin:0}
.gloss p + p{margin-top:8px}
.gloss .label{font-weight:600}
.gloss a{color:inherit;text-underline-offset:3px}
.basis{display:inline-block;margin-top:9px;padding:2px 9px;border:1px dashed currentColor;border-radius:999px;font-size:12.5px;opacity:.85}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.meter{display:flex;align-items:center;gap:10px;font-weight:600}
.ticks{display:inline-flex;gap:3px}
.ticks i{width:4px;height:13px;border-radius:1px;background:var(--desk);opacity:.2}
.ticks i.on{opacity:1}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:13px}
.onboard{font-size:13px;color:var(--ink-soft)}
.foot{margin:40px 0 0;padding-top:14px;border-top:1px solid var(--rule);color:var(--ink-soft);font-size:13px;max-width:47rem}

/* buttons */
.btn{appearance:none;font:500 13px/1 var(--ui);padding:8px 13px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
a.btn{text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.quiet{background:none;border-color:transparent;color:var(--ink-soft)}
.btn.quiet:hover{color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.45;cursor:default}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:40px;align-items:start}
.col{border-top:1px solid var(--ink);padding:12px 0 28px;min-height:160px;border-radius:0 0 8px 8px}
.col.over{background:var(--desk-wash)}
.col-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;font:600 14px/1.3 var(--ui)}
.col-h .n{font-weight:400;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.col-empty{color:var(--ink-soft);font-size:13.5px;margin:0}
.slip{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 14px 12px;margin:0 0 10px;cursor:pointer}
.slip:hover{border-color:var(--ink-soft)}
.slip.dragging{opacity:.4}
.slip-title{font:400 18px/1.24 var(--display);margin:0}
.slip-meta{margin:7px 0 0;color:var(--ink-soft);font-size:12.5px;line-height:1.4}
.slip-note{margin:11px 0 0;padding:8px 10px;background:var(--mine-wash);border-left:2px solid var(--mine-edge);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.slip-nonote{margin:11px 0 0;color:var(--ink-soft);font-size:13px}
.slip-foot{display:flex;gap:6px;margin-top:10px}
.mini{appearance:none;border:1px solid var(--rule);background:none;color:var(--ink-soft);border-radius:999px;padding:5px 10px;font:500 12px/1 var(--ui);cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--ink)}

/* forms */
.form{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px;margin-top:28px;max-width:47rem;display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label{font:500 13px/1.3 var(--ui)}
.field input,.field textarea{font:400 15px/1.4 var(--ui);background:var(--well);border:1px solid var(--rule);border-radius:6px;padding:9px 11px;width:100%}
.field textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{color:var(--ink-soft);font-size:13px;margin:0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,10,16,.42);z-index:10}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--sheet);border-left:1px solid var(--rule);z-index:11;overflow:auto;padding:22px clamp(18px,4vw,32px) 40px;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{font:400 28px/1.15 var(--display);margin:20px 0 0;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;margin-top:20px}
.seg button{appearance:none;border:0;background:none;font:500 13px/1 var(--ui);padding:7px 12px;border-radius:999px;color:var(--ink-soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.notes-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 8px;font:600 14px/1.3 var(--ui)}
.saved{font-weight:400;font-size:12.5px;color:var(--ink-soft)}
.notes{display:block;width:100%;min-height:300px;background:var(--mine-wash);border:0;border-left:2px solid var(--mine-edge);border-radius:0 4px 4px 0;padding:14px 16px;font:400 15px/1.6 var(--ui);color:var(--ink);resize:vertical}
.notes::placeholder{color:var(--ink-soft)}

/* ledger */
.ledger{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;margin-top:40px}
.block{border-top:1px solid var(--ink);padding-top:12px;min-width:0}
.block.wide{grid-column:1/-1}
.block h2{font:600 14px/1.3 var(--ui);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:4px 11px;font-size:13px;background:var(--sheet)}
.field .threads{display:block;width:100%;min-height:150px;background:var(--mine-wash);border:0;border-left:2px solid var(--mine-edge);border-radius:0 4px 4px 0;padding:12px 14px;font:400 14.5px/1.6 var(--ui);color:var(--ink);resize:vertical}
.jgroup{margin:16px 0 0;font:500 13px/1.3 var(--ui);color:var(--ink-soft)}
.jlist{list-style:none;padding:0;margin:6px 0 0;font-size:13.5px}
.jlist li{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.jlist .issn{color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.runs{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px;min-width:560px}
.runs th{text-align:left;font-weight:500;color:var(--ink-soft);padding:6px 14px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.runs td{padding:10px 14px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.runs .r{text-align:right;font-variant-numeric:tabular-nums}
.runs td.note{color:var(--ink-soft);min-width:18rem}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .entry{grid-template-columns:2.4rem minmax(0,1fr)}
  .entry.flat{grid-template-columns:minmax(0,1fr)}
  .gloss{grid-column:2;margin-top:16px}
  .entry.flat .gloss{grid-column:1}
  .board{grid-template-columns:1fr}
  .col{min-height:0}
  .ledger{grid-template-columns:1fr;gap:36px}
  .grid2{grid-template-columns:1fr}
  .status{margin-left:0;width:100%}
}
@media (max-width:480px){
  .entry{grid-template-columns:minmax(0,1fr)}
  .num{padding:0 0 4px}
  .gloss{grid-column:1}
  .title{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
.stack{display:grid;gap:40px;align-content:start;min-width:0}
.block a,.area-sub a{color:var(--desk);text-underline-offset:3px}
.open{margin:6px 0 0;font-size:13px;color:var(--ink-soft)}
.open a{color:var(--desk);text-underline-offset:3px}
.runs td:first-child{white-space:nowrap}
.summary{font:400 14px/1.68 var(--text);margin:12px 0 0;max-width:37rem}
.footnav{display:none;flex-wrap:wrap;align-items:center;gap:10px 24px;margin-top:56px;padding-top:16px;border-top:1px solid var(--rule)}
body[data-view="new"] .mast{display:none}
body[data-view="new"] .footnav{display:flex}
body[data-view="new"] #main{padding-top:22px}
.seg.tight{margin-top:0}
.flush>.area:first-child{margin-top:0}
.deck-wrap{margin-top:0}
.lede+.deck-wrap{margin-top:32px}
.deck-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.deck-chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{appearance:none;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 13.5px/1 var(--ui);cursor:pointer}
.chipbtn .n{margin-left:7px;font-weight:400;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chipbtn:hover{border-color:var(--ink)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chipbtn[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chipbtn:disabled{opacity:.45;cursor:default;border-color:var(--rule)}
.deck-nav{display:flex;align-items:center;gap:8px;margin-left:auto}
.deck-count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:4.6em;text-align:right}
.navbtn{appearance:none;width:34px;height:34px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:400 20px/1 var(--ui);cursor:pointer;display:grid;place-items:center;padding:0 0 3px}
.navbtn:hover{border-color:var(--ink)}
.navbtn:disabled{opacity:.35;cursor:default;border-color:var(--rule)}
.deck{position:relative;display:flex;gap:36px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:thin;margin:16px calc(-1*var(--gutter)) 0;padding:34px calc(50% + var(--gutter) - var(--pw)/2) 46px;background:var(--well);--pw:min(440px,calc(100vw - 56px))}
.paper{--jl:color-mix(in srgb,var(--j,#5A606C) 30%,#fff);--jw:color-mix(in srgb,var(--j,#5A606C) 6%,#fff);flex:0 0 var(--pw);min-height:600px;scroll-snap-align:center;display:flex;flex-direction:column;background:var(--sheet);border:7px solid var(--j,var(--ink-soft));border-radius:20px;padding:20px 24px 18px;box-shadow:0 1px 2px rgba(20,22,27,.10),0 22px 34px -22px rgba(20,22,27,.50)}
.paper-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;font-size:12.5px;line-height:1.35;color:var(--ink-soft);border-bottom:2px solid var(--j,var(--ink))}
.paper-venue{display:flex;align-items:flex-end;gap:11px;min-width:0}
.paper-venue>span:last-child{padding-bottom:8px;color:var(--ink)}
.paper-when{text-align:right;flex:none;max-width:45%;padding-bottom:8px}
.jmark{flex:none;box-sizing:border-box;display:inline-grid;place-items:center;width:36px;height:46px;background:var(--j,var(--ink-soft));color:#fff;font:400 12.5px/1 var(--display);letter-spacing:.03em;box-shadow:inset 0 0 0 3px var(--j,var(--ink-soft)),inset 0 0 0 4px rgba(255,255,255,.6)}
.jmark[data-len="1"],.jmark[data-len="2"]{font-size:16px}
.jmark[data-len="4"]{font-size:10.5px;letter-spacing:0}
.jmark.swatch{display:inline-block;width:9px;height:12px;margin-right:7px;vertical-align:-1px;box-shadow:none}
.jname{display:flex;align-items:center;gap:10px;min-width:0}
.jlist li{align-items:center}
.jlist .jmark{width:28px;height:36px;font-size:10px;box-shadow:none}
.jlist .jmark[data-len="1"],.jlist .jmark[data-len="2"]{font-size:12.5px}
.jlist .jmark[data-len="4"]{font-size:8.5px}
.aff{color:var(--ink-soft);font-weight:400}
.jlogo{flex:none;display:block;height:46px;width:auto;max-width:112px;object-fit:contain;object-position:left bottom;margin-bottom:7px}
.jlogo.compact{display:inline-block;max-width:64px;height:24px;margin:0 7px 0 0;vertical-align:middle;object-position:left center}
.slip .jlogo.compact{display:block;margin:0 0 6px}
.jlist .jlogo{height:36px;max-width:64px;margin:0;object-position:left center}
.paper-venue{position:relative}
.paper-venue.wordmark>span:last-child{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
body[data-view="signin"] .mast,body[data-view="signin"] .footnav{display:none}
.signin{max-width:400px;margin:16vh auto 0}
.signin h1{font:400 36px/1.1 var(--display);margin:0 0 8px}
.signin-sub{color:var(--ink-soft);margin:0 0 30px}
.signin-form{display:grid;gap:16px}
.signin-msg{margin:0;min-height:1.5em;color:#9B2226;font-size:14px}
.paper-title{font:400 25px/1.17 var(--display);margin:18px 0 0;text-wrap:balance}
.paper-title a{color:inherit;text-decoration:none}
.paper-title a:hover,.paper-title a:focus-visible{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.paper-authors{margin:10px 0 0;font-weight:500;font-size:14px}
.paper-type{margin:16px 2px 7px;font-size:12px;line-height:1.3;color:var(--ink-soft)}
.paper-authors+.paper-box,.paper-title+.paper-box{margin-top:18px}
.paper-box{flex:1;display:flex;flex-direction:column;border:1px solid var(--jl);border-radius:10px;background:var(--jw);padding:14px 16px 13px}
.paper-summary{font:400 13.5px/1.7 var(--text);margin:0 0 12px}
.paper-note{margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--ink-soft)}
.paper-why{margin:auto 0 0;padding-top:11px;border-top:1px solid var(--jl);color:var(--j,var(--desk));font-size:13.5px;line-height:1.5}
.paper .acts{margin-top:14px;align-items:center}
.paper .open-copy{margin-left:auto;font-size:12.5px;color:var(--j,var(--desk));text-underline-offset:3px}
.lv{display:inline-block;vertical-align:1px;padding:0 6px;border-radius:999px;background:var(--j,var(--ink));color:#fff;font:600 10.5px/1.6 var(--ui);letter-spacing:.02em;white-space:nowrap}
.lv.pop{animation:lvpop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes lvpop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.3);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.lv.pop{animation:none}}
.slip{position:relative;border-radius:10px;border-top:4px solid var(--j,var(--rule))}
.slip-title{padding-right:32px}
.plus{position:absolute;top:9px;right:10px;width:26px;height:26px;display:grid;place-items:center;padding:0 0 1px;border:1px solid var(--rule);border-radius:50%;background:var(--sheet);color:var(--ink-soft);font:500 17px/1 var(--ui);cursor:pointer}
.plus:hover{border-color:var(--ink-soft);color:var(--ink)}
.plus[aria-pressed="true"]{background:var(--j,var(--ink));border-color:var(--j,var(--ink));color:#fff}
.sheet-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:20px}
.sheet-row .seg{margin-top:0}
.find{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:26px}
.find input{flex:0 1 420px;min-width:0;appearance:none;font:400 15px/1.3 var(--ui);background:var(--well);border:1px solid var(--rule);border-radius:999px;padding:9px 16px;color:var(--ink)}
.find input::placeholder{color:var(--ink-soft)}
.find-n{font:400 13px/1.3 var(--ui);color:var(--ink-soft)}
.pdfrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:18px;padding:12px 14px;background:var(--well);border-radius:8px}
.pdfname{flex:1 1 170px;min-width:0;font:400 13px/1.4 var(--ui);color:var(--ink-soft);overflow-wrap:anywhere}
.pdfname b{display:block;font-weight:500;color:var(--ink)}
.pdfmsg{flex-basis:100%;margin:2px 0 0;font:400 13px/1.4 var(--ui);color:var(--ink)}
.mini.pdf{border-color:var(--ink-soft);color:var(--ink)}
.slip-hit{margin:8px 0 0;font:500 12px/1.3 var(--ui);color:var(--desk)}
.slip-foot{flex-wrap:wrap}
@media (max-width:480px){.find input{flex-basis:100%}}
.plusbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.entry .gloss{border-left-color:var(--j,var(--desk));color:var(--j,var(--desk))}
.entry .ticks i{background:var(--j,var(--desk))}
.entry .open a{color:var(--j,var(--desk))}

</div>
<div id="layer" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

var AREAS=[];
var DATA=['papers','desk','issues','runs','journals','profile','user-seed','fulltext','desk-log','logo-catalog','stock-log','spend'];
var COLS=[['queue','To read'],['reading','Reading'],['done','Finished']];
var VIEWS=[['new','New'],['desk','Desk'],['reserve','Reserve'],['board','Board'],['ledger','Ledger']];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

var S={ready:false,failed:false,failMsg:'',nodata:false,dataAt:0,seed:null,logos:{},logoColor:{},logoWide:{},logoNote:'',lv:{},pop:{},outArmed:false,papers:[],desk:[],issues:[],runs:[],journals:null,profile:null,full:{},desklog:[],stocklog:[],spend:{},q:'',pdfIndex:null,pdfIndexAt:0,pdfIndexBusy:false,pdfBusy:{},
  view:'new',issue:null,showDismissed:false,adding:false,filling:false,
  form:blankForm(),threads:null,raf:0,stale:false,sheet:null,deck:null,deckAt:{},layout:'sheets'};
var U=blankUser();
var artworkIndex=buildArtworkIndex([]),artworkBySha=new Map();
var Sync={repo:'',token:'',sha:null,state:'local',msg:'',timer:0,busy:false,again:false,pulled:0};

function blankForm(){return {cite:'',title:'',authors:'',venue:'',year:'',url:''};}
function blankUser(){return {version:1,areas:null,threads:null,threadsAt:'',board:{},gone:{},dismissed:{},updatedAt:''};}
function $(id){return document.getElementById(id);}
function str(v){return typeof v==='string'?v:(v==null?'':String(v));}
function arr(x){return Array.isArray(x)?x:[];}
function obj(x){return x&&typeof x==='object'&&!Array.isArray(x)?x:{};}
function normUser(u){
  u=obj(u);var o=blankUser();
  o.areas=Array.isArray(u.areas)?u.areas:null;
  o.threads=typeof u.threads==='string'?u.threads:null;
  o.threadsAt=str(u.threadsAt);o.board=obj(u.board);o.gone=obj(u.gone);o.dismissed=obj(u.dismissed);o.updatedAt=str(u.updatedAt);
  return o;
}
function h(tag,attrs){
  var e=document.createElement(tag),k,v,i,c;
  if(attrs){for(k in attrs){v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);}}
  for(i=2;i<arguments.length;i++){c=arguments[i];
    if(c==null||c===false)continue;
    if(Array.isArray(c))c.forEach(function(x){if(x!=null&&x!==false)e.append(x);});
    else e.append(c);}
  return e;
}
function fmtDate(v,short){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(str(v));
  if(!m)return str(v);
  var mon=MONTHS[+m[2]-1]||'';
  return (+m[3])+' '+(short?mon.slice(0,3):mon)+' '+m[1];
}
function word(n){
  if(!Number.isInteger(n)||n<0||n>99)return String(n);
  if(n<20)return ONES[n];
  var o=n%10;return TENS[Math.floor(n/10)]+(o?'-'+ONES[o]:'');
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function count(n,one,many){return cap(word(n))+' '+(n===1?one:many);}
function safeUrl(u){u=str(u).trim();
  if(/^10\.\d{4,9}\/\S+$/.test(u))return 'https://doi.org/'+u;
  return /^https?:\/\//i.test(u)?u:'';}
function areas(){
  var a=arr(U.areas).filter(function(x){return typeof x==='string'&&x;});
  if(!a.length)a=arr(S.profile&&S.profile.areas).filter(function(x){return typeof x==='string'&&x;});
  return a.length?a:AREAS;
}
function threadsText(){return U.threads!=null?U.threads:str(S.profile&&S.profile.threads);}
function latestRun(){return S.runs.slice().sort(function(a,b){return str(b.at).localeCompare(str(a.at));})[0]||null;}
function boardList(){return Object.keys(U.board).map(function(id){var o={},x=obj(U.board[id]);for(var k in x)o[k]=x[k];o.id=id;return o;});}
function onBoard(id){return Object.prototype.hasOwnProperty.call(U.board,id);}
function dismissed(id){var d=U.dismissed[id];return !!(d&&d.v);}
function now(){return new Date().toISOString();}
function byRank(a,b){return (a.rank||999)-(b.rank||999);}
function isOpen(p){return !dismissed(p.id)&&!onBoard(p.id);}
function later(x,y){return str(x)>str(y);}

var toastT=0;
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},3600);}

/* storage in this browser */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function cacheUser(){lsSet('rr.user',JSON.stringify(U));}

/* notes sync with a private GitHub repository */
function enc(s){var b=new TextEncoder().encode(s),bin='';for(var i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);return btoa(bin);}
function dec(b64){var bin=atob(b64.replace(/\s/g,'')),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b);}
function ghUrl(){return 'https://api.github.com/repos/'+Sync.repo+'/contents/user.json';}
function ghHeaders(write){
  var o={'Authorization':'Bearer '+Sync.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(write)o['Content-Type']='application/json';
  return o;
}
function ghMsg(e){
  var s=e&&e.status;
  if(s===401)return 'GitHub rejected the token. Check that it is current and pasted in full.';
  if(s===403)return 'The token cannot write to the repository. Give it Contents read and write.';
  if(s===404)return 'GitHub cannot find that repository with this token. Check the name and the token’s access.';
  if(s==='parse')return 'The notes file on GitHub is not valid. Open user.json there and repair or delete it.';
  return 'Could not reach GitHub. Notes are saved in this browser and will sync on the next change.';
}
function merge(a,b){
  var o=blankUser(),ids={},k;
  if(later(b.threadsAt,a.threadsAt)){o.threads=b.threads;o.threadsAt=b.threadsAt;o.areas=b.areas||a.areas;}
  else{o.threads=a.threads!=null?a.threads:b.threads;o.threadsAt=a.threadsAt||b.threadsAt;o.areas=a.areas||b.areas;}
  for(k in a.board)ids[k]=1;for(k in b.board)ids[k]=1;for(k in a.gone)ids[k]=1;for(k in b.gone)ids[k]=1;
  for(k in ids){
    var da=a.board[k],db=b.board[k];
    var best=da&&db?(later(db.updatedAt,da.updatedAt)?db:da):(da||db);
    var gone=later(b.gone[k],a.gone[k])?b.gone[k]:(a.gone[k]||b.gone[k]);
    if(best&&!(gone&&later(gone,best.updatedAt)))o.board[k]=withPdf(best,da,db);
    else if(gone)o.gone[k]=gone;
  }
  for(k in a.dismissed)o.dismissed[k]=a.dismissed[k];
  for(k in b.dismissed){var x=o.dismissed[k],y=b.dismissed[k];if(!x||later(y&&y.at,x&&x.at))o.dismissed[k]=y;}
  o.updatedAt=later(b.updatedAt,a.updatedAt)?b.updatedAt:a.updatedAt;
  return o;
}
function withPdf(best,da,db){
  /* the PDF link has its own time, so a note saved on one device cannot drop a PDF attached on another */
  var pa=da&&da.pdf,pb=db&&db.pdf,pdf=pa&&pb?(later(pb.at,pa.at)?pb:pa):(pa||pb);
  if(!pdf||(best.pdf&&JSON.stringify(best.pdf)===JSON.stringify(pdf)))return best;
  var o={};for(var k in best)o[k]=best[k];o.pdf=pdf;return o;
}
function same(a,b){
  function strip(u){var o={};for(var k in u)if(k!=='updatedAt')o[k]=u[k];return JSON.stringify(o);}
  return strip(a)===strip(b);
}
function pull(){
  return fetch(ghUrl(),{headers:ghHeaders(false),cache:'no-store'}).then(function(r){
    if(r.status===404){Sync.sha=null;return null;}
    if(!r.ok)throw {status:r.status};
    return r.json().then(function(j){
      Sync.sha=j.sha;Sync.pulled=Date.now();
      try{return normUser(JSON.parse(dec(str(j.content))));}catch(e){throw {status:'parse'};}
    });
  });
}
function put(attempt){
  var body={message:'Update reading room notes',content:enc(JSON.stringify(U,null,1))};
  if(Sync.sha)body.sha=Sync.sha;
  return fetch(ghUrl(),{method:'PUT',headers:ghHeaders(true),body:JSON.stringify(body)}).then(function(r){
    if((r.status===409||r.status===422)&&attempt<2){
      return pull().then(function(remote){
        if(remote){U=merge(U,remote);cacheUser();schedule();}
        return put(attempt+1);
      });
    }
    if(!r.ok)throw {status:r.status};
    return r.json().then(function(j){if(j&&j.content&&j.content.sha)Sync.sha=j.content.sha;});
  });
}
function pushNow(){
  clearTimeout(Sync.timer);
  if(!Sync.token||!Sync.repo)return Promise.resolve();
  if(Sync.busy){Sync.again=true;return Promise.resolve();}
  Sync.busy=true;Sync.state='saving';renderStatus();
  return put(0).then(function(){Sync.state='synced';Sync.msg='';lsDel('rr.dirty');},
    function(e){Sync.state='error';Sync.msg=ghMsg(e);})
  .then(function(){
    Sync.busy=false;renderStatus();
    if(Sync.again){Sync.again=false;return pushNow();}
  });
}
function changed(){
  U.updatedAt=now();cacheUser();
  if(Sync.token&&Sync.repo){lsSet('rr.dirty','1');Sync.state='saving';clearTimeout(Sync.timer);Sync.timer=setTimeout(pushNow,1500);}
  schedule();
}
function initialSync(){
  Sync.state='saving';renderStatus();
  return pull().then(function(remote){
    if(!remote)return pushNow();
    if(lsGet('rr.dirty')==='1'){U=merge(U,remote);cacheUser();schedule();return pushNow();}
    U=remote;cacheUser();Sync.state='synced';schedule();
  }).catch(function(e){Sync.state='error';Sync.msg=ghMsg(e);schedule();});
}
function connect(repo,token){
  repo=str(repo).trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  token=str(token).trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return Promise.reject({text:'Write the repository as owner/name.'});
  if(!token)return Promise.reject({text:'Paste the token first.'});
  Sync.repo=repo;Sync.token=token;Sync.sha=null;
  return fetch('https://api.github.com/repos/'+repo,{headers:ghHeaders(false),cache:'no-store'}).then(function(r){
    if(!r.ok)throw {status:r.status};
    lsSet('rr.sync',JSON.stringify({repo:repo,token:token}));
    return start();
  },function(){throw {status:0};}).catch(function(e){
    if(!lsGet('rr.sync'))Sync.token='';
    throw {text:e&&e.text?e.text:(e&&e.status===0?'Could not reach GitHub. Check the connection and try again.':ghMsg(e))};
  });
}
function signOut(){
  if(lsGet('rr.dirty')==='1'&&!S.outArmed){
    S.outArmed=true;toast('Some notes have not reached GitHub yet. Press again to sign out without them.');
    if(Sync.state!=='error')pushNow();
    return;
  }
  ['rr.sync','rr.dirty','rr.user','rr.data','rr.logos'].forEach(lsDel);
  try{if(window.caches){caches.delete('rr-logos');caches.delete('rr-pdfs');}}catch(e){}
  history.replaceState(null,'',location.pathname);
  location.reload();
}
function syncLabel(){
  if(Sync.state==='synced')return 'Notes synced';
  if(Sync.state==='saving')return 'Saving notes';
  if(Sync.state==='error')return 'Notes not synced';
  return 'Signed out';
}

/* actions */
function boardDoc(p,from){
  return {title:str(p.title),authors:str(p.authors),venue:str(p.venue),issns:paperSerials(p),cite:str(p.cite),
    year:p.year||str(p.date).slice(0,4)||'',url:safeUrl(p.url),column:'queue',note:'',
    order:Date.now(),addedAt:now(),updatedAt:now(),from:from};
}
function save(p,from){
  U.board[p.id]=boardDoc(p,from);delete U.gone[p.id];S.lv=levels();
  var said=people(p.authors).slice(0,3).map(function(x){return x.name+' is now level '+S.lv[authorKey(x.name)];});
  changed();toast('Saved to board.'+(said.length?' '+said.join('. ')+'.':''));
}
function dismiss(p,flag){U.dismissed[p.id]={v:!!flag,at:now()};changed();toast(flag?'Dismissed':'Restored');}
function move(id,col){if(!U.board[id])return;U.board[id].column=col;U.board[id].updatedAt=now();changed();}
function removeFromBoard(id){delete U.board[id];U.gone[id]=now();changed();toast('Removed from board');}

/* PDFs: kept in pdfs/ in the private repository, attached to a paper on the board */
var PDF_MAX=25*1024*1024;
function hasPdf(b){return !!(b&&b.pdf&&b.pdf.path&&!b.pdf.gone);}
function mb(n){n=Number(n)||0;return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function pdfPath(id){return 'pdfs/'+(str(id).toLowerCase().replace(/[^a-z0-9._-]+/g,'_').replace(/^[._]+/,'').slice(0,120)||'paper')+'.pdf';}
function ghFile(path){return 'https://api.github.com/repos/'+Sync.repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/');}
function netFail(){throw {status:0};}
function pdfMsg(e){
  if(e&&e.text)return e.text;
  var s=e&&e.status;
  if(s===401||s===403)return ghMsg(e);
  if(s===404)return 'The PDF is not in the repository any more.';
  if(s===413||s===422)return 'GitHub would not take the file. It may be too large.';
  return 'Could not reach GitHub. Check the connection and try again.';
}
function pdfSha(path){
  /* the file's current id on GitHub, which GitHub asks for before it replaces or deletes a file; null when it is not there */
  var hd=ghHeaders(false);hd.Accept='application/vnd.github.object+json';
  return fetch(ghFile(path),{headers:hd,cache:'no-store'}).then(function(r){
    if(r.status===404)return null;
    if(!r.ok)throw {status:r.status};
    return r.json().then(function(j){return str(j&&j.sha)||null;});
  },netFail);
}
function fileB64(file){
  return new Promise(function(res,rej){var r=new FileReader();
    r.onload=function(){res(str(r.result).split(',')[1]||'');};r.onerror=function(){rej({text:'The file could not be read.'});};r.readAsDataURL(file);});
}
function looksLikePdf(file){
  return file.slice(0,1024).arrayBuffer().then(function(buf){
    var b=new Uint8Array(buf),t='';for(var i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);
    return t.indexOf('%PDF')>=0;},function(){return false;});
}
function pdfCache(){try{return window.caches?caches.open('rr-pdfs').catch(function(){return null;}):Promise.resolve(null);}catch(e){return Promise.resolve(null);}}
function pdfKey(p){return 'https://pdfs.invalid/'+encodeURIComponent(p.path)+'?at='+encodeURIComponent(str(p.at));}
function pdfKeep(p,blob){
  return pdfCache().then(function(c){if(c)return c.put(pdfKey(p),new Response(blob,{headers:{'Content-Type':'application/pdf'}}));}).catch(function(){});
}
function pdfForget(p){return pdfCache().then(function(c){if(c)return c.delete(pdfKey(p));}).catch(function(){});}
function attachPdf(id,file){
  if(!U.board[id])return Promise.reject({text:'That paper is no longer on the board.'});
  if(file.size>PDF_MAX)return Promise.reject({text:'That file is '+mb(file.size)+'. The most a PDF can be here is 25 MB.'});
  var path=pdfPath(id);
  return looksLikePdf(file).then(function(ok){
    if(!ok)throw {text:'That file is not a PDF.'};
    return Promise.all([fileB64(file),pdfSha(path)]);
  }).then(function(x){
    var body={message:'Add PDF: '+str(U.board[id]&&U.board[id].title).slice(0,70),content:x[0]};
    if(x[1])body.sha=x[1];
    return fetch(ghFile(path),{method:'PUT',headers:ghHeaders(true),body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw {status:r.status};},netFail);
  }).then(function(){
    var b=U.board[id];if(!b)return;
    if(hasPdf(b))pdfForget(b.pdf);
    b.pdf={path:path,name:str(file.name).slice(0,120),size:file.size,at:now()};b.updatedAt=now();
    pdfKeep(b.pdf,file);
    S.pdfIndexAt=0;changed();
  });
}
function removePdf(id){
  var b=U.board[id];if(!hasPdf(b))return Promise.resolve();
  var p=b.pdf;
  return pdfSha(p.path).then(function(sha){
    if(!sha)return;
    return fetch(ghFile(p.path),{method:'DELETE',headers:ghHeaders(true),body:JSON.stringify({message:'Remove PDF: '+str(b.title).slice(0,70),sha:sha})})
      .then(function(r){if(!r.ok&&r.status!==404)throw {status:r.status};},netFail);
  }).then(function(){
    pdfForget(p);
    var cur=U.board[id];if(!cur)return;
    cur.pdf={gone:true,at:now()};cur.updatedAt=now();changed();
  });
}
function pdfBlob(p){
  /* the copy kept on this device if there is one, otherwise from GitHub, and then kept */
  return pdfCache().then(function(c){return c?c.match(pdfKey(p)):null;}).catch(function(){return null;}).then(function(hit){
    if(hit)return hit.blob();
    return ghRaw(p.path).then(function(r){if(!r.ok)throw {status:r.status};return r.blob();},netFail).then(function(blob){
      blob=new Blob([blob],{type:'application/pdf'});pdfKeep(p,blob);return blob;});
  });
}
function openPdf(id){
  var b=U.board[id];if(!hasPdf(b))return;
  /* the window has to be opened in the same breath as the press, or the browser blocks it; the PDF follows */
  var w=null;try{w=window.open('','_blank');}catch(e){}
  if(w){try{w.document.title=str(b.title);w.document.body.textContent='Opening the PDF.';}catch(e){}}
  else toast('Opening the PDF');
  return pdfBlob(b.pdf).then(function(blob){
    var url=URL.createObjectURL(blob);
    if(w&&!w.closed)w.location.replace(url);
    else{var a=h('a',{href:url,download:str(b.pdf.name)||'paper.pdf'});document.body.append(a);a.click();a.remove();}
    setTimeout(function(){URL.revokeObjectURL(url);},600000);
  },function(e){if(w)try{w.close();}catch(x){}toast(pdfMsg(e));});
}
function pdfRow(id){
  var row=h('div',{class:'pdfrow'});
  function draw(msg){
    var b=U.board[id];row.replaceChildren();if(!b)return;
    if(S.pdfBusy[id]){row.append(h('span',{class:'pdfname',role:'status'},h('b',null,S.pdfBusy[id]),'Keep this page open until it finishes.'));return;}
    var pick=h('input',{type:'file',accept:'application/pdf,.pdf',hidden:true,tabindex:'-1','aria-label':'Choose a PDF'});
    pick.addEventListener('change',function(){
      var f=pick.files&&pick.files[0];if(!f)return;
      S.pdfBusy[id]='Uploading '+mb(f.size);draw();
      attachPdf(id,f).then(function(){delete S.pdfBusy[id];draw('Saved to your private repository.');toast('PDF attached');},
        function(e){delete S.pdfBusy[id];draw(pdfMsg(e));});
    });
    if(hasPdf(b)){
      var rm=h('button',{class:'btn quiet',type:'button'},'Remove PDF'),armed=false;
      rm.addEventListener('click',function(){
        if(!armed){armed=true;rm.textContent='Press again to remove';setTimeout(function(){armed=false;rm.textContent='Remove PDF';},4000);return;}
        S.pdfBusy[id]='Removing the PDF';draw();
        removePdf(id).then(function(){delete S.pdfBusy[id];draw('PDF removed.');},function(e){delete S.pdfBusy[id];draw(pdfMsg(e));});
      });
      row.append(h('button',{class:'btn solid',type:'button',onclick:function(){openPdf(id);}},'Open PDF'),
        h('span',{class:'pdfname'},h('b',null,str(b.pdf.name)||'PDF'),mb(b.pdf.size)+', added '+fmtDate(b.pdf.at,true)),
        h('button',{class:'btn',type:'button',onclick:function(){pick.click();}},'Replace'),rm,pick);
    }else{
      row.append(h('button',{class:'btn',type:'button',onclick:function(){pick.click();}},'Attach a PDF'),
        h('span',{class:'pdfname'},'Kept in your private repository and opened from any device you are signed in on. 25 MB at most.'),pick);
    }
    if(msg)row.append(h('p',{class:'pdfmsg',role:'status'},msg));
  }
  draw();return row;
}
/* searching the board, and inside its PDFs through the word index the repository builds */
function fold(v){var t=str(v);try{t=t.normalize('NFKD');}catch(e){}return t.replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function terms(q){return fold(q).split(/[^a-z0-9]+/).filter(function(t){return t;});}
function boardMatch(b,toks){
  /* 0: no match. 1: every word is on the card or in its notes. 2: some words were found only in the PDF. */
  if(!toks.length)return 1;
  var own=fold([b.title,b.authors,b.venue,b.year,b.cite,b.note,hasPdf(b)?b.pdf.name:''].join(' '));
  var entry=hasPdf(b)&&S.pdfIndex?S.pdfIndex[b.pdf.path]:null,words=entry&&entry.words?' '+str(entry.words):'',inPdf=false;
  for(var i=0;i<toks.length;i++){
    if(own.indexOf(toks[i])>=0)continue;
    if(words&&toks[i].length<3)continue;      /* the index holds words of three letters or more */
    if(words&&words.indexOf(' '+toks[i])>=0){inPdf=true;continue;}
    return 0;
  }
  return inPdf?2:1;
}
function loadPdfIndex(){

function bare(a){return str(a).replace(/\s*\[[^\]]*\]/g,'');}
/* aff:start  Institutions are shown in their short everyday form: "Purdue", "Edinburgh", "UCLA". */
var AFF_KNOWN=[
  [/^university of california,? (?:at )?los angeles$/i,'UCLA'],
  [/^university of california,? (?:at )?(.+)$/i,'UC $1'],
  [/^university of southern california$/i,'USC'],
  [/^university of british columbia$/i,'UBC'],
  [/^massachusetts institute of technology$/i,'MIT'],
  [/^california institute of technology$/i,'Caltech'],
  [/^new york university$/i,'NYU'],
  [/^london school of economics(?: and political science)?$/i,'LSE'],
  [/^university college london$/i,'UCL'],
  [/^australian national university$/i,'ANU'],
  [/^national university of singapore$/i,'NUS'],
  [/^city university of new york\b.*$/i,'CUNY'],
  [/^university of north carolina(?: at|,)? chapel hill$/i,'UNC Chapel Hill'],
  [/^university of texas(?: at|,)? austin$/i,'UT Austin'],
  [/^freie universit[aä]t berlin$/i,'FU Berlin'],
  [/^humboldt[- ]universit[aä]t(?: zu)? berlin$/i,'HU Berlin'],
  [/^ludwig[- ]maximilians[- ]universit[aä]t(?: m[uü]nchen)?$/i,'LMU Munich']
];
/* Left in full: what remains would be a bare adjective, or two different schools would read the same. */
var AFF_VAGUE=/^(open|national|central|technical|catholic|american|european|normal|medical|federal|international|christian|free|autonomous|pontifical|polytechnic)$/i;
var AFF_SHARED=/^(york|boston|miami|newcastle|northeastern|western|lincoln|trinity|victoria|queen's|st\.? ?louis)$/i;
function shortPlace(place){
  var t=str(place).trim().replace(/^the\s+/i,''),i,m,out='';
  for(i=0;i<AFF_KNOWN.length;i++)if(AFF_KNOWN[i][0].test(t))return t.replace(AFF_KNOWN[i][0],AFF_KNOWN[i][1]);
  if((m=/^(?:university|universit[àa]|universit[ée]|universit[aä]t|universidad|universidade|universiteit)\s+(?:of|degli studi di|di|de|del|della|do|da|zu|van)\s+(?:the\s+)?(.+)$/i.exec(t)))out=m[1];
  else if((m=/^universit(?:[aä]t|[ée])\s+(.+)$/i.exec(t)))out=m[1];
  else if((m=/^(.+?)\s+(?:university|universit[aä]t|universitet|universiteit)$/i.exec(t))&&!/\b(of|for|and)\b/i.test(m[1]))out=m[1];
  if(!out)return t;
  if(AFF_SHARED.test(out)||AFF_VAGUE.test(out.split(/\s+/).pop()))return t;
  return out;
}
function shortAff(aff){

}
/* aff:end */
/* authors: "Name [Institution], Name" split into people; a level is how many papers on the board carry a + for that author */
function people(a){
  return str(a).split(/,\s*(?![^\[]*\])/).map(function(part){
    var m=/^(.*?)\s*(\[[^\]]*\])?\s*$/.exec(part)||[];
    return {name:str(m[1]).trim(),aff:str(m[2])};

}
function authorKey(n){

/* Every paper on the board raises its authors one level; a starred paper raises them three. */

function levels(){
  var m={};
  Object.keys(U.board).forEach(function(id){
    var b=U.board[id];if(!b)return;
    var gain=isStar(b)?3:1;
    people(b.authors).forEach(function(x){var k=authorKey(x.name);if(k)m[k]=(m[k]||0)+gain;});
  });
  return m;
}
function lvChip(name){

function venueKey(v){return str(v).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().replace(/^the /,'');}
function initials(v){
  var w=str(v).replace(/&/g,' ').split(/[^A-Za-z\u00C0-\u024F]+/).filter(function(x){return x&&!/^(the|of|and|for|in|on|a|an)$/i.test(x);});

function buildArtworkIndex(rows){
  var titles=new Map(),serials=new Map(),ambiguous=new Set();
  function add(map,key,row){
    if(!key)return;

    map.get(key).add(row);
  }
  arr(rows).forEach(function(row){
    if(!row||!row.title)return;
    [row.title].concat(arr(row.aliases)).forEach(function(s){add(titles,publicationTitle(s),row);});
    arr(row.issns).forEach(function(s){add(serials,serialKey(s),row);});
    arr(row.ambiguous).forEach(function(s){ambiguous.add(publicationTitle(s));});
  });

}
function matchArtwork(title,issns){
  var key=publicationTitle(title),byTitle=artworkIndex.titles.get(key),byId=new Set();
  var ids=arr(issns).map(serialKey).filter(function(id){return /^\d{7}[\dX]$/.test(id);});
  ids.forEach(function(id){var rows=artworkIndex.serials.get(id);if(rows)rows.forEach(function(r){byId.add(r);});});
  if(byId.size===1)return byId.values().next().value;
  if(!byTitle)return byId.size?false:null;
  var options=Array.from(byTitle);
  if(byId.size){
    options=options.filter(function(r){return byId.has(r);});
  }else if(artworkIndex.ambiguous.has(key)||options.length!==1||(ids.length&&arr(options[0].issns).length)){
    return false;

function collectionArtwork(row){
  if(!row||!row.file||!/^[-a-z0-9]+\.webp$/.test(row.file)||!/^[a-f0-9]{40}$/.test(row.sha))return {};
  var prior=artworkBySha.get(row.sha);
  if(prior&&(!prior.retryAt||Date.now()<prior.retryAt))return prior;
  var art={};artworkBySha.set(row.sha,art);
  function decode(blob){
    if(!blob.size||blob.size>LOGO_MAX)throw Error('Invalid image size');
    var src=URL.createObjectURL(blob);
    return inspectLogo(src).then(function(info){
      if(info.invalid){URL.revokeObjectURL(src);throw Error('Invalid journal image');}
      art.url=src;art.color=info.color;art.wide=info.wide;
      schedule();
    });
  }
  logoCache().then(function(cache){
    var url=logoKey(row.sha);
    function fromRepository(){
      return ghRaw('logos/library/'+encodeURIComponent(row.file)).then(function(r){
        if(!r.ok)throw Error('Image unavailable');
        return r.blob();
      }).then(function(blob){
        return decode(blob).then(function(){

      });

    return (cache?cache.match(url).catch(function(){return null;}):Promise.resolve(null)).then(function(hit){

    });

  return art;
}

function deck(key,groups,kind){

  var plusBtn=h('button',{class:'btn plusbtn',type:'button','aria-pressed':String(isStar(b))},isStar(b)?'\u2605 Starred':'\u2606 Star');
  plusBtn.addEventListener('click',function(){togglePlus(id);var on=isStar(U.board[id]);
    plusBtn.setAttribute('aria-pressed',String(on));plusBtn.textContent=on?'\u2605 Starred':'\u2606 Star';});
  var gone=h('button',{class:'btn quiet',type:'button'},'Remove from board'),goneArmed=false;
  gone.addEventListener('click',function(){
    var cur=U.board[id],hasOne=hasPdf(cur);
    if(hasOne&&!goneArmed){goneArmed=true;gone.textContent='Press again to remove the paper and its PDF';return;}
    function finish(){var x=S.sheet;if(x)clearTimeout(x.timer);S.sheet=null;hideLayer();removeFromBoard(id);}
    if(!hasOne){finish();return;}
    gone.disabled=true;gone.textContent='Removing';
    removePdf(id).then(finish,function(e){gone.disabled=false;goneArmed=false;gone.textContent='Remove from board';toast(pdfMsg(e)+' The paper was left on the board.');});
  });
  var panel=h('aside',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':str(b.title)},
    h('div',{class:'sheet-top'},close,url?h('a',{class:'btn',href:url,target:'_blank',rel:'noopener'},'Open the paper'):null),
    h('h2',null,str(b.title)),
    byline(b.authors),
    h('p',{class:'cite'},b.venue?jmark(b.venue,true,b.issns):null,citeLine({venue:b.venue,cite:b.cite||str(b.year)})),
    h('div',{class:'sheet-row'},seg,plusBtn),
    pdfRow(id),
    h('div',{class:'notes-h'},h('label',{for:'sheet-notes'},'Your notes'),saved),
    ta,
    h('div',{class:'acts'},gone));
  var scrim=h('div',{class:'scrim',onclick:closeSheet});
  S.sheet={id:id,ta:ta,saved:saved,timer:0,last:str(b.note),touched:false};
  ta.addEventListener('input',function(){S.sheet.touched=true;saved.textContent='Editing';clearTimeout(S.sheet.timer);S.sheet.timer=setTimeout(flushNote,600);});
  var layer=$('layer');layer.replaceChildren(scrim,panel);layer.hidden=false;
  close.focus();
}
function flushNote(){
  var sh=S.sheet;if(!sh)return;
  clearTimeout(sh.timer);
  var val=sh.ta.value;if(val===sh.last||!U.board[sh.id])return;
  sh.last=val;U.board[sh.id].note=val;U.board[sh.id].updatedAt=now();
  changed();renderStatus();
}
function hideLayer(){var layer=$('layer');layer.hidden=true;layer.replaceChildren();}
function closeSheet(){if(!S.sheet)return;flushNote();S.sheet=null;hideLayer();}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.sheet){closeSheet();return;}
  if(!S.deck||S.sheet||e.altKey||e.ctrlKey||e.metaKey)return;
  var tag=e.target&&e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(e.key==='ArrowRight'){e.preventDefault();S.deck.move(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();S.deck.move(-1);}
});
window.addEventListener('resize',function(){if(S.deck)S.deck.fix();});

/* rendering */
var VIEWFN={new:viewNew,desk:viewDesk,reserve:viewReserve,board:viewBoard,ledger:viewLedger};
function renderStatus(){
  var run=latestRun(),parts=[];
  if(run)parts.push('Checked '+fmtDate(run.at,true));
  if(S.ready)parts.push(syncLabel());
  var text=parts.join('. ');
  $('status').textContent=text;$('status2').textContent=text;
  if(S.sheet&&S.sheet.touched){
    S.sheet.saved.textContent=Sync.state==='saving'?'Saving':Sync.state==='synced'?'Synced':Sync.state==='error'?'Saved here, not synced':'Saved in this browser';
  }
}
function renderTabs(){
  var counts={};
  if(S.ready){
    counts.new=S.papers.filter(function(p){return p.lane==='new'&&isOpen(p);}).length;
    counts.reserve=S.papers.filter(function(p){return (p.lane==='reserve'||p.lane==='classic')&&isOpen(p);}).length;
    counts.board=Object.keys(U.board).length;
  }
  [$('tabs'),$('tabs2')].forEach(function(nav){
    nav.replaceChildren();
    VIEWS.forEach(function(v){
      nav.append(h('button',{class:'tab',type:'button','aria-current':S.view===v[0]?'page':null,onclick:function(){go(v[0]);}},
        v[1],counts[v[0]]!=null?h('span',{class:'n'},String(counts[v[0]])):null));
    });
  });
  document.body.setAttribute('data-view',Sync.token?S.view:'signin');
  var extra=$('footextra');extra.replaceChildren();
  if(S.ready&&S.view==='new')extra.append(layoutToggle());
  renderStatus();
}
function render(force){
  renderTabs();
  var main=$('main'),a=document.activeElement;
  if(!force&&a&&main.contains(a)&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')){S.stale=true;return;}
  S.stale=false;S.deck=null;S.lv=levels();
  if(!Sync.token){main.replaceChildren(viewSignIn());return;}
  main.replaceChildren(VIEWFN[S.view]());
  if(S.deck)S.deck.fix();
}
function schedule(){if(S.raf)return;S.raf=requestAnimationFrame(function(){S.raf=0;render(false);});}
document.addEventListener('focusout',function(){if(S.stale)setTimeout(schedule,0);});
function route(){var k=location.hash.replace('#','');S.view=VIEWFN[k]?k:'new';}
function go(v){if(location.hash==='#'+v)return;location.hash=v;}
window.addEventListener('hashchange',function(){route();window.scrollTo(0,0);render(true);});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||!Sync.token||Sync.busy||S.sheet)return;
  if(lsGet('rr.dirty')==='1'||Date.now()-Sync.pulled<60000)return;
  pull().then(function(remote){if(remote&&!same(remote,U)){U=remote;cacheUser();schedule();}Sync.state='synced';renderStatus();}).catch(function(){});
  if(Date.now()-S.dataAt>3*3600000)loadData().then(function(ok){if(ok)schedule();});
});
window.addEventListener('beforeunload',function(){if(S.sheet)flushNote();});

/* everything is read from the private repository */
function ghRaw(path){
  return fetch('https://api.github.com/repos/'+Sync.repo+'/contents/'+path,
    {headers:{'Authorization':'Bearer '+Sync.token,'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'});
}
function ghData(name){
  return ghRaw('data/'+name+'.json').then(function(r){
    if(r.status===404)return null;
    if(!r.ok)throw {status:r.status};
    return r.text().then(function(t){try{return JSON.parse(t);}catch(e){return null;}});
  });
}
function applyData(d){
  S.papers=arr(d[0]);S.desk=arr(d[1]);S.issues=arr(d[2]);S.runs=arr(d[3]);S.journals=d[4];S.jmap=null;S.profile=d[5];S.seed=d[6];
  S.full=obj(d[7]);S.desklog=arr(d[8]);
  artworkIndex=buildArtworkIndex(d[9]);
  S.stocklog=arr(d[10]);S.spend=obj(d[11]);
}
function parseStored(k){try{return JSON.parse(lsGet(k)||'null');}catch(e){return null;}}
function loadData(){
  return Promise.all(DATA.map(function(name){
    if(name!=='logo-catalog')return ghData(name);
    return ghData(name).catch(function(){return arr(parseStored('rr.data'))[9]||null;});
  })).then(function(d){
    S.dataAt=Date.now();S.failed=false;S.nodata=d[0]==null;
    applyData(d);
    if(!S.nodata)lsSet('rr.data',JSON.stringify(d));
    return true;
  },function(e){
    if(S.ready){toast('Could not reach GitHub. Showing the copy saved in this browser.');return false;}
    S.failed=true;S.failMsg=e&&e.status?ghMsg(e):'Could not reach GitHub. Check the connection and reload.';
    render(true);return false;
  });
}
function start(){
  var cached=parseStored('rr.data'),local=parseStored('rr.user');
  S.failed=false;
  if(local)U=normUser(local);
  if(local&&Array.isArray(cached)&&cached[0]){applyData(cached);S.ready=true;logosFromCache();}
  render(true);
  return loadData().then(function(ok){
    if(!ok)return;
    if(!local){U=normUser(S.seed);cacheUser();}
    render(true);
    return initialSync().then(function(){S.ready=true;render(true);return loadLogos();});
  });
}

/* journal logos: image files the reader keeps in the private repository, shown only in this browser */
var LOGO_TYPES={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',svg:'image/svg+xml'};
var LOGO_MAX=600000;
function logoTargets(){
  var m={};
  arr(S.journals&&S.journals.list).concat(arr(S.journals&&S.journals.other)).forEach(function(j){
    var k=venueKey(j.name);if(!k)return;
    if(j.issn)m[str(j.issn).toLowerCase()]=k;
    m[k.replace(/ /g,'-')]=k;
  });
  return m;
}
function logoCache(){try{return window.caches?caches.open('rr-logos').catch(function(){return null;}):Promise.resolve(null);}catch(e){return Promise.resolve(null);}}
function logoKey(sha){return 'https://logos.invalid/'+encodeURIComponent(sha);}
function setLogo(key,blob,known){
  if(S.logos[key])URL.revokeObjectURL(S.logos[key]);
  S.logos[key]=URL.createObjectURL(blob);
  return (known?Promise.resolve(known):inspectLogo(S.logos[key])).then(function(info){
    if(info.color)S.logoColor[key]=info.color;else delete S.logoColor[key];
    if(info.wide)S.logoWide[key]=true;else delete S.logoWide[key];
    return info;
  });
}
function lum(r,g,b){
  var v=[r,g,b].map(function(c){c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);});
  return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];
}
/* What the page needs to know about a logo image.
   color: the hue that carries most of the logo's colour, ignoring white, greys and black, darkened until it
   reads as text on white. Empty when the logo has almost no colour, so the journal keeps the colour set for it.
   wide: the image is at least twice as wide as it is tall, which is how a wordmark is told from an emblem. */
function inspectLogo(url){
  return new Promise(function(done){
    var im=new Image();
    im.onerror=function(){done({color:'',wide:false,invalid:true});};
    im.onload=function(){
      var wide=im.naturalHeight>0&&im.naturalWidth/im.naturalHeight>=2,color='';
      try{
        var n=48,c=document.createElement('canvas');c.width=n;c.height=n;
        var x=c.getContext('2d');x.drawImage(im,0,0,n,n);
        var d=x.getImageData(0,0,n,n).data,bins={},seen=0,tinted=0,best=null,i,r,g,b,mx,mn,ch,hue,k,o;
        for(i=0;i<d.length;i+=4){
          if(d[i+3]<128)continue;
          r=d[i];g=d[i+1];b=d[i+2];mx=Math.max(r,g,b);mn=Math.min(r,g,b);
          if(mn>225)continue;
          seen++;ch=mx-mn;
          if(mx<40||ch/mx<0.25)continue;
          tinted++;
          hue=mx===r?((g-b)/ch+6)%6:mx===g?(b-r)/ch+2:(r-g)/ch+4;
          k=Math.floor(hue*2)%12;
          o=bins[k]||(bins[k]={w:0,r:0,g:0,b:0});o.w+=ch;o.r+=r*ch;o.g+=g*ch;o.b+=b*ch;
        }
        for(k in bins)if(!best||bins[k].w>best.w)best=bins[k];
        if(best&&tinted>=seen*0.05){
          r=best.r/best.w;g=best.g/best.w;b=best.b/best.w;
          for(i=0;i<60&&1.05/(lum(r,g,b)+0.05)<4.5;i++){r*=0.94;g*=0.94;b*=0.94;}
          color='#'+[r,g,b].map(function(v){return ('0'+Math.round(v).toString(16)).slice(-2);}).join('');
        }
      }catch(e){}
      done({color:color,wide:wide});
    };
    im.src=url;
  });
}
function logosFromCache(){
  var idx=arr(parseStored('rr.logos'));
  if(!idx.length)return Promise.resolve();
  return logoCache().then(function(c){
    if(!c)return;
    return Promise.all(idx.map(function(x){
      return c.match(logoKey(x.sha)).then(function(r){return r?r.blob():null;}).then(function(b){if(b)return setLogo(str(x.key),b,{color:/^#[0-9a-f]{6}$/i.test(str(x.color))?x.color:'',wide:x.wide===true});});
    })).then(schedule);
  }).catch(function(){});
}
function loadLogos(){
  return ghRaw('logos').then(function(r){
    if(r.status===404)return [];
    if(!r.ok)throw {status:r.status};
    return r.json();
  }).then(function(list){
    var targets=logoTargets(),want=[],skipped=0;
    arr(list).forEach(function(f){
      var m=/^(.+)\.([a-z0-9]+)$/i.exec(str(f&&f.name));
      if(!m||f.type!=='file'||!LOGO_TYPES[m[2].toLowerCase()])return;
      var key=targets[m[1].toLowerCase()];
      if(!key||(f.size||0)>LOGO_MAX){skipped++;return;}
      want.push({key:key,sha:str(f.sha),name:str(f.name),mime:LOGO_TYPES[m[2].toLowerCase()]});
    });
    return logoCache().then(function(c){
      return Promise.all(want.map(function(x){
        return (c?c.match(logoKey(x.sha)):Promise.resolve(null)).then(function(hit){
          if(hit)return hit.blob();
          return ghRaw('logos/'+encodeURIComponent(x.name)).then(function(r){
            if(!r.ok)throw {status:r.status};
            return r.arrayBuffer();
          }).then(function(buf){
            var blob=new Blob([buf],{type:x.mime});
            if(c)c.put(logoKey(x.sha),new Response(blob,{headers:{'Content-Type':x.mime}})).catch(function(){});
            return blob;
          });
        }).then(function(blob){return setLogo(x.key,blob).then(function(info){x.color=info.color;x.wide=info.wide;return x;});}).catch(function(){return null;});
      }));
    }).then(function(done){
      done=done.filter(Boolean);
      var keep={};done.forEach(function(x){keep[x.key]=1;});
      Object.keys(S.logos).forEach(function(k){if(!keep[k]){URL.revokeObjectURL(S.logos[k]);delete S.logos[k];delete S.logoColor[k];delete S.logoWide[k];}});
      lsSet('rr.logos',JSON.stringify(done.map(function(x){return {key:x.key,sha:x.sha,color:x.color||'',wide:!!x.wide};})));
      S.logoNote=done.length?count(done.length,'journal logo','journal logos')+' shown from the logos folder.'+(skipped?' '+count(skipped,'file was','files were')+' skipped: the name matches no journal, or the file is over 600 KB.':'')
        :'No journal logos yet. Add image files to a logos folder in the repository, each named by the journal’s ISSN, for example 0048-3915.png.';
      schedule();
    });
  }).catch(function(){S.logoNote='The logos folder could not be read.';});
}

function boot(){
  S.layout=lsGet('rr.layout')==='list'?'list':'sheets';
  route();
  var saved=parseStored('rr.sync');
  if(saved&&saved.repo&&saved.token){Sync.repo=str(saved.repo);Sync.token=str(saved.token);start();}
  else render(true);
}
boot();
})();
</script>
